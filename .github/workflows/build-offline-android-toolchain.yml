name: Build Offline Android Toolchain

on:
  push:
    paths:
      - 'offline-android-toolchain-trigger.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build fully offline Android toolchain bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/android-offline-toolchain"
          SDK="$ROOT/android-sdk"
          GRADLE_ROOT="$ROOT/gradle"
          JDK_ROOT="$ROOT/jdk-21"
          TMP="$RUNNER_TEMP/android-toolchain-downloads"
          mkdir -p "$SDK/cmdline-tools" "$GRADLE_ROOT" "$TMP" "$ROOT/bin"

          echo '==> Android command-line tools'
          curl -fL --retry 5 --retry-all-errors \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o "$TMP/cmdline-tools.zip"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$TMP/cmdline-tools.zip" | sha256sum -c -
          unzip -q "$TMP/cmdline-tools.zip" -d "$TMP/cmdline"
          mv "$TMP/cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/build-tools/36.0.0:$PATH"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

          echo '==> Gradle 8.11.1'
          curl -fL --retry 5 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o "$TMP/gradle.zip"
          echo 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  '"$TMP/gradle.zip" | sha256sum -c -
          unzip -q "$TMP/gradle.zip" -d "$GRADLE_ROOT"

          echo '==> Portable JDK 21'
          cp -a "$JAVA_HOME/." "$JDK_ROOT/"

          cat > "$ROOT/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export JAVA_HOME="$ROOT/jdk-21"
          export ANDROID_HOME="$ROOT/android-sdk"
          export ANDROID_SDK_ROOT="$ROOT/android-sdk"
          export GRADLE_HOME="$ROOT/gradle/gradle-8.11.1"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/36.0.0:$GRADLE_HOME/bin:$PATH"
          echo "Offline Android toolchain activated: $ROOT"
          EOF
          chmod +x "$ROOT/activate.sh"

          cat > "$ROOT/verify.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "$0")" && pwd)"
          source "$ROOT/activate.sh" >/dev/null
          java -version
          sdkmanager --version
          adb version
          aapt2 version
          apksigner version
          zipalign -h >/dev/null 2>&1 || true
          gradle --version | head -n 10
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          echo 'VERIFY_OK'
          EOF
          chmod +x "$ROOT/verify.sh"

          cat > "$ROOT/build-basic-apk-offline.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "$0")" && pwd)"
          source "$ROOT/activate.sh" >/dev/null
          APPDIR="${1:-$PWD/offline-basic-app}"
          OUT="$APPDIR/out"
          PKG=com.earthgames.offlinetest
          mkdir -p "$APPDIR/src/com/earthgames/offlinetest" "$APPDIR/res/values" "$OUT/classes" "$OUT/dex"
          cat > "$APPDIR/AndroidManifest.xml" <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-sdk android:minSdkVersion="23" android:targetSdkVersion="36" />
            <application android:theme="@android:style/Theme.Material.Light" android:label="Offline Build Test">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
          cat > "$APPDIR/src/com/earthgames/offlinetest/MainActivity.java" <<'JAVA'
          package com.earthgames.offlinetest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              TextView v = new TextView(this);
              v.setText("Offline Android build works");
              v.setTextSize(24);
              setContentView(v);
            }
          }
          JAVA
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          javac -source 8 -target 8 -classpath "$ANDROID_JAR" -d "$OUT/classes" $(find "$APPDIR/src" -name '*.java')
          d8 --lib "$ANDROID_JAR" --output "$OUT/dex" $(find "$OUT/classes" -name '*.class')
          aapt2 link -I "$ANDROID_JAR" --manifest "$APPDIR/AndroidManifest.xml" -o "$OUT/app-unsigned.apk"
          (cd "$OUT/dex" && zip -q "$OUT/app-unsigned.apk" classes.dex)
          zipalign -f 4 "$OUT/app-unsigned.apk" "$OUT/app-aligned.apk"
          if [ ! -f "$OUT/debug.keystore" ]; then
            keytool -genkeypair -keystore "$OUT/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Earth Games,C=TR' -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1
          fi
          apksigner sign --ks "$OUT/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$OUT/app-debug.apk" "$OUT/app-aligned.apk"
          apksigner verify --verbose "$OUT/app-debug.apk"
          echo "$OUT/app-debug.apk"
          EOF
          chmod +x "$ROOT/build-basic-apk-offline.sh"

          cat > "$ROOT/README.txt" <<'EOF'
          FULL OFFLINE ANDROID BUILD TOOLCHAIN — Linux x86_64

          Included:
          - Temurin JDK 21 (portable copy from GitHub runner)
          - Android Command-Line Tools 15859902
          - Android SDK Platform 36
          - Android SDK Build-Tools 36.0.0
          - Android Platform-Tools
          - Gradle 8.11.1
          - activate.sh
          - verify.sh
          - build-basic-apk-offline.sh (builds a basic APK without Maven/AGP/network)

          Offline use:
          1. Extract archive.
          2. source activate.sh
          3. ./verify.sh
          4. ./build-basic-apk-offline.sh /tmp/my-test-app

          The raw APK builder requires no Maven repository and no internet. Existing Gradle projects may still require their own third-party dependency cache unless all dependencies are already vendored/cached.
          EOF

          echo '==> Verify toolchain and build smoke-test APK'
          "$ROOT/verify.sh"
          "$ROOT/build-basic-apk-offline.sh" "$RUNNER_TEMP/smoke-app"
          test -s "$RUNNER_TEMP/smoke-app/out/app-debug.apk"

          echo '==> Manifest and archive'
          (cd "$ROOT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          du -sh "$ROOT"
          tar --zstd -cf "$RUNNER_TEMP/android-offline-toolchain-api36-linux-x86_64.tar.zst" -C "$ROOT" .
          sha256sum "$RUNNER_TEMP/android-offline-toolchain-api36-linux-x86_64.tar.zst" > "$RUNNER_TEMP/android-offline-toolchain-api36-linux-x86_64.tar.zst.sha256"
          ls -lh "$RUNNER_TEMP/android-offline-toolchain-api36-linux-x86_64.tar.zst"*

      - name: Upload offline toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-offline-toolchain-api36-linux-x86_64
          path: |
            ${{ runner.temp }}/android-offline-toolchain-api36-linux-x86_64.tar.zst
            ${{ runner.temp }}/android-offline-toolchain-api36-linux-x86_64.tar.zst.sha256
            ${{ runner.temp }}/smoke-app/out/app-debug.apk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
